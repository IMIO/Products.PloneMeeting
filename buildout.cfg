[buildout]
extends = https://raw.githubusercontent.com/IMIO/buildout.pm/refs/heads/master/communes-dev.cfg
# test the code of this checkout (pushed branch or PR merge commit)
# instead of a mr.developer clone of a fixed branch, so the branch name
# does not need to be changed here when working on a branch
develop = .
auto-checkout -= Products.PloneMeeting
# if Products.PloneMeeting was activated manually in an existing buildout,
# run "bin/develop deactivate Products.PloneMeeting" before rerunning buildout

[versions]
# unpin so the develop egg of this checkout is used, this was
# done by mr.developer when Products.PloneMeeting was in auto-checkout
Products.PloneMeeting =
Products.PloneHotfix20261110 = 1.0

[code-analysis]
directory = ${buildout:directory}/src/Products
